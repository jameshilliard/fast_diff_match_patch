# See https://github.com/pypa/cibuildwheel.

name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_TEST_COMMAND: "python -m unittest discover {project}/tests"
          CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
          CIBW_ARCHS_LINUX: "auto64 auto32"
          CIBW_ARCHS_WINDOWS: "auto"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Build the source distribution under Linux
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          # Check whether the source distribution will render correctly
          python -m twine check dist/*.tar.gz

      - name: Test source distribution
        run: |
          python -m pip install ./dist/*.tar.gz
          python -c "from fast_diff_match_patch import diff"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz
